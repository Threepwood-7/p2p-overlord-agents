[workspace]
members = [
    "crates/overlord-agent-common",
    "crates/overlord-agent-nat",
    "crates/overlord-agent-emule",
    "crates/miniupnpc-sys",
    "crates/miniupnpc",
    "crates/overlord-tools",
    "crates/overlord-kad-proto",
    "crates/overlord-kad-routing",
    "crates/overlord-kad-net",
    "crates/overlord-kad-dht",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
binrw = "0.14"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
futures-util = "0.3"

[patch.crates-io]
rupnp = { git = "https://github.com/Threepwood-7/rupnp", tag = "v3.0.0-overlord.1" }
ssdp-client = { git = "https://github.com/Threepwood-7/ssdp-client", tag = "v2.1.0-overlord.1" }
