services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: overlord
      POSTGRES_USER: overlord
      POSTGRES_PASSWORD: overlord
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  overlord-be-coordinator:
    build: ../overlord-be/overlord-be-coordinator
    ports:
      - "13300:13300"
    environment:
      DATABASE_URL: postgresql://overlord:overlord@postgres:5432/overlord
      PORT: 13300
    depends_on:
      - postgres

  overlord-agent-emule:
    build: .
    command: ["cargo", "run", "-p", "overlord-agent-emule", "--bin", "overlord-agent-emule", "--", "--config", "/config/overlord.toml"]
    ports:
      - "13301:13301"
      - "41000:41000/udp"
    volumes:
      - ./overlord.toml.example:/config/overlord.toml
    environment:
      OVERLORD_COORDINATOR_URL: http://overlord-be-coordinator:13300
    depends_on:
      - overlord-be-coordinator

volumes:
  postgres_data:
